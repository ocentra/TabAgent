name: Build and Deploy Everything

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Server/**'
      - 'package.json'
      - 'manifest.json'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
    inputs:
      bitnet_version:
        description: 'BitNet build version to use (e.g., build-123 or latest)'
        required: false
        default: 'latest'
  repository_dispatch:
    types: [bitnet_release]

jobs:
  # Job 1: Build Browser Extension
  build-extension:
    name: Build Browser Extension
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm ci

    - name: Build extension only
      run: npm run build:extension

    - name: Upload extension artifact
      uses: actions/upload-artifact@v4
      with:
        name: extension
        path: TabAgentDist/Extension/

  # Job 2: Download BitNet Complete Release (CPU + GPU)
  download-bitnet-release:
    name: Download BitNet Complete Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Determine BitNet version
      id: bitnet_version
      run: |
        if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
          VERSION="${{ github.event.client_payload.release_tag }}"
          RELEASE_URL="${{ github.event.client_payload.release_url }}"
        elif [ -n "${{ github.event.inputs.bitnet_version }}" ]; then
          VERSION="${{ github.event.inputs.bitnet_version }}"
          RELEASE_URL=""
        else
          VERSION="latest"
          RELEASE_URL=""
        fi
        
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "release_url=$RELEASE_URL" >> $GITHUB_OUTPUT
        echo "📦 Using BitNet version: $VERSION"
    
    - name: Download BitNet Release
      run: |
        VERSION="${{ steps.bitnet_version.outputs.version }}"
        RELEASE_URL="${{ steps.bitnet_version.outputs.release_url }}"
        REPO="ocentra/BitNet"
        
        # Determine download URL
        if [ -n "$RELEASE_URL" ]; then
          echo "📥 Downloading from provided URL: $RELEASE_URL"
          DOWNLOAD_URL="$RELEASE_URL"
        elif [ "$VERSION" = "latest" ]; then
          echo "📥 Downloading latest BitNet release..."
          DOWNLOAD_URL="https://github.com/$REPO/releases/latest/download/BitNet-Release.zip"
        else
          echo "📥 Downloading BitNet release version: $VERSION"
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$VERSION/BitNet-Release.zip"
        fi
        
        # Download and extract
        curl -L "$DOWNLOAD_URL" -o BitNet-Release.zip
        
        if [ -f "BitNet-Release.zip" ]; then
          unzip -q BitNet-Release.zip -d BitNet-Release/
          echo "✅ BitNet release downloaded and extracted"
          echo "📁 Contents:"
          ls -R BitNet-Release/
        else
          echo "❌ Failed to download BitNet release!"
          exit 1
        fi
    
    - name: Upload BitNet Release as artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitnet-complete-release
        path: BitNet-Release/

  # Job 3: Build Native Host Binaries (3 platforms)
  build-binaries:
    name: Build Native Host (${{ matrix.platform }})
    needs: download-bitnet-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            executable_name: tabagent-host.exe
          - os: macos-latest
            platform: macos
            executable_name: tabagent-host
          - os: ubuntu-latest
            platform: linux
            executable_name: tabagent-host

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download BitNet Complete Release
      uses: actions/download-artifact@v4
      with:
        name: bitnet-complete-release
        path: BitNet-Release/
    
    - name: Integrate BitNet CPU and GPU into Server
      shell: bash
      run: |
        PLATFORM="${{ matrix.platform }}"
        
        echo "📦 Integrating BitNet $PLATFORM components..."
        
        # Create directories
        mkdir -p Server/backends/bitnet/binaries/$PLATFORM
        mkdir -p Server/backends/bitnet/gpu/$PLATFORM
        
        # Copy CPU binary
        if [ "$PLATFORM" = "windows" ]; then
          cp BitNet-Release/cpu/windows/llama-server.exe Server/backends/bitnet/binaries/windows/
          echo "✅ CPU binary copied"
        else
          cp BitNet-Release/cpu/$PLATFORM/llama-server Server/backends/bitnet/binaries/$PLATFORM/
          chmod +x Server/backends/bitnet/binaries/$PLATFORM/llama-server
          echo "✅ CPU binary copied"
        fi
        
        # Copy GPU modules and kernels
        if [ -d "BitNet-Release/gpu/$PLATFORM" ]; then
          cp -r BitNet-Release/gpu/$PLATFORM/* Server/backends/bitnet/gpu/$PLATFORM/
          echo "✅ GPU modules copied"
        else
          echo "⚠️ No GPU modules for $PLATFORM"
        fi
        
        echo "📁 BitNet integration complete:"
        echo "  CPU:"
        ls -lh Server/backends/bitnet/binaries/$PLATFORM/
        echo "  GPU:"
        ls -lh Server/backends/bitnet/gpu/$PLATFORM/ 2>/dev/null || echo "  (none)"

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Setup and build (Windows)
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        cd Server
        python -m venv venv
        .\venv\Scripts\activate
        pip install pyinstaller
        pip install -r requirements.txt
        cd build-tool
        .\build.bat

    - name: Setup and build (Unix)
      if: matrix.platform != 'windows'
      shell: bash
      run: |
        cd Server
        python -m venv venv
        source venv/bin/activate
        pip install pyinstaller
        pip install -r requirements.txt
        cd build-tool
        ./build-${{ matrix.platform }}.sh

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.platform }}
        path: TabAgentDist/NativeApp/binaries/${{ matrix.platform }}/

  # Job 4: Prepare Windows Installer (PowerShell GUI)
  prepare-windows-installer:
    name: Prepare Windows PowerShell Installer
    needs: [build-extension, build-binaries]
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download extension artifact
      uses: actions/download-artifact@v4
      with:
        name: extension
        path: TabAgentDist/Extension

    - name: Download Windows binary
      uses: actions/download-artifact@v4
      with:
        name: binary-windows
        path: TabAgentDist/NativeApp/binaries/windows

    - name: Create Release folder and zip extension
      shell: pwsh
      run: |
        $releaseDir = "TabAgentDist/Release"
        New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
        Compress-Archive -Path "TabAgentDist/Extension/*" -DestinationPath "$releaseDir/tabagent-extension.zip" -Force
        Write-Host "Extension zipped to Release folder"


    - name: Upload Windows installer package
      uses: actions/upload-artifact@v4
      with:
        name: installer-windows
        path: |
          TabAgentDist/Release/
          TabAgentDist/NativeApp/binaries/windows/
          TabAgentDist/NativeApp/installers/windows/

  # Job 5: Prepare macOS Installer (Shell Script)
  prepare-macos-installer:
    name: Prepare macOS Shell Installer
    needs: [build-extension, build-binaries]
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download extension artifact
      uses: actions/download-artifact@v4
      with:
        name: extension
        path: TabAgentDist/Extension

    - name: Download macOS binary
      uses: actions/download-artifact@v4
      with:
        name: binary-macos
        path: TabAgentDist/NativeApp/binaries/macos

    - name: Make binary executable
      run: |
        chmod +x TabAgentDist/NativeApp/binaries/macos/tabagent-host

    - name: Create Release folder and zip extension
      run: |
        mkdir -p TabAgentDist/Release
        cd TabAgentDist/Extension
        zip -r ../Release/tabagent-extension.zip .
        echo "Extension zipped to Release folder"


    - name: Upload macOS installer package
      uses: actions/upload-artifact@v4
      with:
        name: installer-macos
        path: |
          TabAgentDist/Release/
          TabAgentDist/NativeApp/binaries/macos/
          TabAgentDist/NativeApp/installers/macos/

  # Job 6: Prepare Linux Installer (Shell Script)
  prepare-linux-installer:
    name: Prepare Linux Shell Installer
    needs: [build-extension, build-binaries]
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download extension artifact
      uses: actions/download-artifact@v4
      with:
        name: extension
        path: TabAgentDist/Extension

    - name: Download Linux binary
      uses: actions/download-artifact@v4
      with:
        name: binary-linux
        path: TabAgentDist/NativeApp/binaries/linux

    - name: Make binary executable
      run: |
        chmod +x TabAgentDist/NativeApp/binaries/linux/tabagent-host

    - name: Create Release folder and zip extension
      run: |
        mkdir -p TabAgentDist/Release
        cd TabAgentDist/Extension
        zip -r ../Release/tabagent-extension.zip .
        echo "Extension zipped to Release folder"


    - name: Upload Linux installer package
      uses: actions/upload-artifact@v4
      with:
        name: installer-linux
        path: |
          TabAgentDist/Release/
          TabAgentDist/NativeApp/binaries/linux/
          TabAgentDist/NativeApp/installers/linux/

  # Job 7: Deploy Everything to TabAgentDist
  deploy:
    name: Deploy to TabAgentDist Repository
    needs: [build-extension, prepare-windows-installer, prepare-macos-installer, prepare-linux-installer]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout TabAgentDist repository
      uses: actions/checkout@v4
      with:
        repository: ocentra/TabAgentDist
        token: ${{ secrets.TABAGENT_DIST_TOKEN }}
        path: ./dist-repo

    - name: Download extension artifact
      uses: actions/download-artifact@v4
      with:
        name: extension
        path: ./artifacts/extension

    - name: Download binary artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        path: ./artifacts/binaries

    - name: Download installer artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: installer-*
        path: ./artifacts/installers

    - name: Copy extension to TabAgentDist
      run: |
        rm -rf ./dist-repo/Extension/*
        cp -r ./artifacts/extension/* ./dist-repo/Extension/
        echo "Built from ${{ github.repository }}@${{ github.sha }}" > ./dist-repo/Extension/.build-info

    - name: Copy binaries to TabAgentDist
      run: |
        cp -r ./artifacts/binaries/binary-windows/* ./dist-repo/NativeApp/binaries/windows/
        cp -r ./artifacts/binaries/binary-macos/* ./dist-repo/NativeApp/binaries/macos/
        cp -r ./artifacts/binaries/binary-linux/* ./dist-repo/NativeApp/binaries/linux/

    - name: Copy Release folder and installers to TabAgentDist
      run: |
        # Create Release folder
        mkdir -p ./dist-repo/Release
        
        # Copy Windows installer (PowerShell scripts + Release folder)
        cp -r ./artifacts/installers/installer-windows/TabAgentDist/Release/* ./dist-repo/Release/ 2>/dev/null || true
        cp -r ./artifacts/installers/installer-windows/TabAgentDist/NativeApp/installers/windows/* ./dist-repo/NativeApp/installers/windows/ 2>/dev/null || true
        
        # Copy macOS installer (Shell scripts + Release folder)
        cp -r ./artifacts/installers/installer-macos/TabAgentDist/Release/* ./dist-repo/Release/ 2>/dev/null || true
        cp -r ./artifacts/installers/installer-macos/TabAgentDist/NativeApp/installers/macos/* ./dist-repo/NativeApp/installers/macos/ 2>/dev/null || true
        
        # Copy Linux installer (Shell scripts + Release folder)
        cp -r ./artifacts/installers/installer-linux/TabAgentDist/Release/* ./dist-repo/Release/ 2>/dev/null || true
        cp -r ./artifacts/installers/installer-linux/TabAgentDist/NativeApp/installers/linux/* ./dist-repo/NativeApp/installers/linux/ 2>/dev/null || true

    - name: Commit and push to TabAgentDist
      run: |
        cd ./dist-repo
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "Auto-deploy: Build ${{ github.run_number }}" -m "Extension + Native App + Installers" -m "Source: ${{ github.repository }}@${{ github.sha }}"
        git push

  # Job 8: Create GitHub Release (Optional - only on tags)
  create-release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout TabAgentDist repository
      uses: actions/checkout@v4
      with:
        repository: ocentra/TabAgentDist
        token: ${{ secrets.TABAGENT_DIST_TOKEN }}
        path: ./dist-repo

    - name: Download all installer artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: installer-*
        path: ./installers

    - name: Download extension artifact
      uses: actions/download-artifact@v4
      with:
        name: extension
        path: ./extension

    - name: Create extension ZIP for release
      run: |
        cd ./extension
        zip -r ../TabAgent-Extension-${{ github.ref_name }}.zip .

    - name: Get version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release in TabAgentDist
      uses: softprops/action-gh-release@v1
      with:
        repository: ocentra/TabAgentDist
        tag_name: v${{ steps.version.outputs.version }}
        name: Tab Agent v${{ steps.version.outputs.version }}
        body: |
          ## Tab Agent v${{ steps.version.outputs.version }}
          
          ### 🚀 Installation Options
          
          **Windows:**
          - Download `NativeApp/installers/windows/install-gui.ps1`
          - Right-click > Run with PowerShell
          - Or: `powershell -ExecutionPolicy Bypass -File install-gui.ps1`
          - Extension zip will be downloaded automatically from Release folder
          
          **macOS:**
          - Download `NativeApp/installers/macos/install-tabagent.sh`
          - Run in Terminal: `chmod +x install-tabagent.sh && ./install-tabagent.sh`
          - Extension zip will be downloaded automatically from Release folder
          
          **Linux:**
          - Download `NativeApp/installers/linux/install-tabagent.sh`
          - Run in Terminal: `chmod +x install-tabagent.sh && ./install-tabagent.sh`
          - Extension zip will be downloaded automatically from Release folder
          
          **Manual Extension Load:**
          - Download `Release/tabagent-extension.zip`
          - Extract and load unpacked in browser
          
          ### 📋 What's Included
          - ✅ Native messaging host (all platforms)
          - ✅ Browser extension
          - ✅ LM Studio integration
          - ✅ Multi-browser support (Chrome, Edge, Firefox, Opera, Brave, Vivaldi)
          
          ---
          Built from TabAgent@${{ github.sha }}
        draft: false
        prerelease: false
        files: |
          ./installers/installer-windows/TabAgentDist/Release/tabagent-extension.zip
          ./TabAgent-Extension-${{ github.ref_name }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.TABAGENT_DIST_TOKEN }}

